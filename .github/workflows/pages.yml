name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  # 插件在别的仓库发版，推到这里不会触发任何事件：定时扫一遍才是常态。
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 每次部署都重扫一遍插件仓库：线上索引永远指向当下的 commit，没有人手工同步版本号。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-index.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
